name: Installer and corresponding source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format and lint
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Installer and maintainer tool tests
        run: cargo +1.98.0 test --locked --workspace
      - name: Fetch the complete pinned DXVK source archives
        run: |
          mkdir -p build
          curl --fail --location --retry 30 --retry-all-errors --retry-delay 10 \
            --output build/corresponding-source.tar.gz \
            https://github.com/marselnenaj/fenix-a320-linux-patch/releases/download/v0.1.0-preview.8/fenix-a320-linux-patch-0.1.0-preview.8-source.tar.gz
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          root = pathlib.Path('.')
          bundle = json.loads((root / 'bundle.json').read_text())
          with tarfile.open('build/corresponding-source.tar.gz') as archive:
              for overlay in [bundle, *bundle['variants'].values()]:
                  if 'dxvk' not in overlay:
                      continue
                  name = overlay['dxvk']['source']
                  data = archive.extractfile(
                      f'fenix-a320-linux-patch-0.1.0-preview.8/sources/{name}'
                  ).read()
                  assert hashlib.sha256(data).hexdigest() == overlay['sources'][name], name
                  (root / 'sources').mkdir(exist_ok=True)
                  (root / 'sources' / name).write_bytes(data)
          PY
      - name: Verify the pinned sources and apply every patch
        run: |
          cargo +1.98.0 build --locked -p fenix-tools
          target/debug/fenix-tools build --prepare-only
          target/debug/fenix-tools build-proton experimental-11 --build-dir build/experimental-source --prepare-only
          target/debug/fenix-tools build-proton cachyos-10 --build-dir build/cachyos-source --prepare-only
          target/debug/fenix-tools build-proton cachyos-11 --build-dir build/cachyos-11-source --prepare-only
  static-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the installer as a release ships it
        run: |
          mkdir -p build/installer
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src:ro -v "$PWD/build/installer":/out \
            -e CARGO_TARGET_DIR=/out/target -e CARGO_HOME=/out/cargo -e HOME=/out -w /src \
            rust:1.98-alpine cargo build --release --locked -p fenix-patch --bin fenix-patch
      - name: It runs without a runtime and finds nothing in an empty home
        run: |
          installer=build/installer/target/release/fenix-patch
          ! readelf -lW "$installer" | grep -q INTERP
          ! readelf -dW "$installer" | grep -q NEEDED
          test "$(env -i HOME="$(mktemp -d)" "$installer" targets)" = '[]'
  legacy-integration:
    # The display helper of the launcher's Python releases is shipped unchanged
    # and hash-pinned; its own checks need that launcher's interpreter.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest tests/test_display_refresh.py -v
